<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — fil perdu · Trameur</title>
  <meta name="theme-color" content="#0b0b0c" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230b0b0c'/><g fill='%23c8ff2e'><rect x='0' y='4' width='4' height='4'/><rect x='8' y='12' width='4' height='4'/><rect x='0' y='20' width='4' height='4'/><rect x='8' y='28' width='4' height='4'/><rect x='12' y='0' width='4' height='4'/><rect x='20' y='4' width='4' height='4'/><rect x='12' y='8' width='4' height='4'/><rect x='20' y='12' width='4' height='4'/><rect x='12' y='16' width='4' height='4'/><rect x='20' y='20' width='4' height='4'/><rect x='12' y='24' width='4' height='4'/><rect x='20' y='28' width='4' height='4'/><rect x='24' y='0' width='8' height='32'/></g></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono&display=swap" rel="stylesheet" />
  <!-- self-contained on purpose: a 404 is served from any path -->
  <style>
    :root { --bg:#0b0b0c; --fg:#eae6dc; --fg-2:#938f85; --line:#34343b; --acid:#c8ff2e; color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:26px;
      background:var(--bg); color:var(--fg);
      font-family:"JetBrains Mono", ui-monospace, Consolas, monospace; font-size:14px; line-height:1.7;
    }
    .box { max-width:640px; width:100%; }
    .lbl { font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--fg-2); }
    .rule { height:1px; background:var(--line); margin:12px 0 22px; }
    h1 {
      font-family:"Anton", Impact, sans-serif; font-weight:400; text-transform:uppercase;
      font-size:clamp(76px,20vw,190px); line-height:.82; margin:0 0 4px; letter-spacing:-.01em;
    }
    h1 span { color:transparent; -webkit-text-stroke:2px var(--fg); }
    p { color:var(--fg-2); margin:0 0 26px; max-width:44ch; }
    canvas { display:block; width:100%; height:96px; image-rendering:pixelated; margin:20px 0 26px; opacity:.9; }
    a {
      display:inline-flex; gap:9px; padding:12px 18px; border:1px solid var(--acid);
      background:var(--acid); color:var(--bg); text-decoration:none;
      font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    }
    a:hover { background:transparent; color:var(--acid); }
  </style>
</head>
<body>
  <div class="box">
    <div class="lbl">Erreur 404 · fil perdu</div>
    <div class="rule"></div>
    <h1>404<br /><span>Perdu</span></h1>
    <canvas id="c" aria-hidden="true"></canvas>
    <p>Cette page s'est effilochée quelque part dans la trame. Ça arrive.</p>
    <a href="/Trameur/">← Retour au portfolio</a>
  </div>

  <script>
    (function () {
      var cv = document.getElementById("c"), ctx = cv.getContext("2d");
      var B = [0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,
               60,28,52,20,62,30,54,22,3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,
               15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21].map(function (v) { return (v + .5) / 64 - .5; });
      var w = 0, h = 0, buf, t = 0;
      function size() {
        var r = cv.getBoundingClientRect();
        w = Math.max(40, Math.round(r.width / 6)); h = Math.max(10, Math.round(w * r.height / r.width));
        cv.width = w; cv.height = h; buf = ctx.createImageData(w, h);
      }
      function draw() {
        var d = buf.data;
        for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
          var v = (Math.sin(x * .09 + t) * .5 + Math.sin(y * .18 - t * .8) * .4 + Math.sin((x + y) * .05 + t * 1.3) * .5) / 1.6 + .5;
          var q = Math.round(v * 3 + B[(y & 7) * 8 + (x & 7)] * 1.1);
          q = q < 0 ? 0 : q > 3 ? 3 : q;
          var i = (y * w + x) * 4;
          if (!q) { d[i + 3] = 0; continue; }
          d[i] = q === 3 ? 200 : 90; d[i + 1] = q === 3 ? 255 : 100; d[i + 2] = q === 3 ? 46 : 70; d[i + 3] = 255;
        }
        ctx.putImageData(buf, 0, 0);
      }
      var last = 0;
      function loop(now) { requestAnimationFrame(loop); if (now - last < 45) return; last = now; t += .07; draw(); }
      addEventListener("resize", function () { size(); draw(); });
      size();
      draw();                                    // never show an empty band
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
